<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berline's Menfess Control</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--navy:#11233f;--orange:#ff8a24;--green:#198754;--red:#d83b49;--muted:#6b7280;--line:#e6e8ef}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#1f2937}
header{background:var(--navy);color:#fff;padding:22px 28px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:1180px;margin:24px auto;padding:0 18px 50px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px rgba(17,35,63,.05)}
.full{grid-column:1/-1}h2{font-size:16px;margin:0 0 14px;color:var(--navy)}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.run{background:var(--green);color:white}.stop{background:var(--red);color:white}.restart{background:var(--orange);color:white}
.buttons{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2f7}
.status-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.status{border:1px solid var(--line);padding:10px;border-radius:12px}.status b{display:block;margin-bottom:4px}.READY,.RUNNING{color:var(--green)}.FLOODWAIT{color:#d97706}.OFFLINE,.STOPPING{color:var(--red)}
textarea{width:100%;min-height:95px;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;resize:vertical}.word{margin-bottom:12px}.word label{display:block;font-weight:700;margin-bottom:6px}
.save{background:var(--navy);color:#fff;margin-top:7px}.logs{background:#0b1220;color:#d1d5db;border-radius:12px;padding:12px;max-height:340px;overflow:auto;font:12px/1.5 Consolas,monospace}
.log{padding:4px 0;border-bottom:1px solid #172033}.muted{color:var(--muted);font-size:12px}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.status-list{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Berline's Menfess Control</h1><p>Telegram tetap dari topic • worker dikontrol dari web</p></header>
<main>
<div class="grid">
<section class="card full">
<div class="toprow"><div><h2>Worker Telegram</h2><span id="worker-pill" class="pill">Mengecek...</span></div>
<div class="buttons"><button class="run" onclick="workerAction('run')">RUN</button><button class="stop" onclick="workerAction('stop')">STOP</button><button class="restart" onclick="workerAction('restart')">RESTART</button></div></div>
<div id="statuses" class="status-list"></div>
</section>

<section class="card">
<h2>Wording 1–5</h2>
<div id="wordings"></div>
</section>

<section class="card">
<h2>Keywords</h2>
<p class="muted">Satu keyword per baris. Perubahan dipakai worker tanpa perlu edit Python.</p>
<textarea id="keywords" style="min-height:410px"></textarea>
<button class="save" onclick="saveKeywords()">Simpan Keywords</button>
</section>

<section class="card full">
<div class="toprow"><h2>Log Sistem</h2><span class="muted">refresh otomatis</span></div>
<div id="logs" class="logs"></div>
</section>
</div>
</main>
<script>
async function req(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function workerAction(action){await req('/api/worker/'+action,{method:'POST'});setTimeout(refreshStatus,700)}
async function refreshStatus(){
 const d=await req('/api/status'); const pill=document.getElementById('worker-pill');
 pill.textContent=d.worker_alive?'🟢 RUNNING'+(d.pid?' • PID '+d.pid:''):'🔴 OFFLINE';
 const el=document.getElementById('statuses'); el.innerHTML='';
 for(const s of d.statuses){
   if(s.name==='WORKER')continue;
   const div=document.createElement('div');div.className='status';
   const extra=s.state==='FLOODWAIT'&&s.remaining?` • ${s.remaining}s`:'';
   div.innerHTML=`<b>${s.name}</b><span class="${s.state}">${s.state}${extra}</span><div class="muted">${s.detail||''}</div>`;
   el.appendChild(div);
 }
}
async function loadWordings(){
 const d=await req('/api/wordings'), el=document.getElementById('wordings');el.innerHTML='';
 for(const n of ['1','2','3','4','5']){
  const div=document.createElement('div');div.className='word';
  div.innerHTML=`<label>Wording ${n}</label><textarea id="w${n}"></textarea><button class="save" onclick="saveWording('${n}')">Simpan Wording ${n}</button>`;
  el.appendChild(div);document.getElementById('w'+n).value=d[n]||'';
 }
}
async function saveWording(n){
 await req('/api/wordings/'+n,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('w'+n).value})});
 alert('Wording '+n+' tersimpan');
}
async function loadKeywords(){const d=await req('/api/keywords');document.getElementById('keywords').value=d.keywords.join('\n')}
async function saveKeywords(){
 const items=document.getElementById('keywords').value.split('\n').map(x=>x.trim()).filter(Boolean);
 const d=await req('/api/keywords',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({keywords:items})});
 alert(d.count+' keyword tersimpan');
}
async function refreshLogs(){
 const d=await req('/api/logs?limit=120'), el=document.getElementById('logs');
 el.innerHTML=d.logs.map(x=>`<div class="log">[${new Date(x.created_at*1000).toLocaleString()}] ${x.source}: ${escapeHtml(x.message)}</div>`).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
loadWordings();loadKeywords();refreshStatus();refreshLogs();setInterval(refreshStatus,2000);setInterval(refreshLogs,4000);
</script>
</body>
</html>
